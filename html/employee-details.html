<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Details</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">
        <div class="header-content">
            <h1>Employee Details</h1>
            <p>View employee information</p>
        </div>
    </header>

    <main class="container">

        <section class="employee-details">

            <div class="details-header">
                <h2>Employee Profile</h2>

                <a href="index.html" class="back-btn">
                    ← Back
                </a>
            </div>

            <div id="employeeDetails" class="details-card">

                <div class="detail-row">
                    <span class="label">Employee ID</span>
                    <span id="employeeId">-</span>
                </div>

                <div class="detail-row">
                    <span class="label">Full Name</span>
                    <span id="fullName">-</span>
                </div>

                <div class="detail-row">
                    <span class="label">Email</span>
                    <span id="email">-</span>
                </div>

                <div class="detail-row">
                    <span class="label">Phone</span>
                    <span id="phone">-</span>
                </div>

                <div class="detail-row">
                    <span class="label">Gender</span>
                    <span id="gender">-</span>
                </div>

                <div class="detail-row">
                    <span class="label">Department</span>
                    <span id="department">-</span>
                </div>

                <div class="detail-row">
                    <span class="label">Designation</span>
                    <span id="designation">-</span>
                </div>

                <div class="detail-row">
                    <span class="label">Employee Type</span>
                    <span id="employeeType">-</span>
                </div>

                <div class="detail-row">
                    <span class="label">Salary</span>
                    <span id="salary">-</span>
                </div>

                <div class="detail-row">
                    <span class="label">Date of Joining</span>
                    <span id="dateOfJoining">-</span>
                </div>

            </div>

        </section>

    </main>

    <script type="module" src="js/details.js"></script>

</body>

</html>
